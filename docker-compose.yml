# ============================================================
# Engram MCP server (HTTP transport)
# ============================================================
# Copy .env.example to .env and fill it in, then: docker compose up -d

services:
  engram:
    build: .
    image: ackstorm/engram:local
    restart: unless-stopped

    environment:
      # --- Transport -----------------------------------------
      ENGRAM_MCP_HOST: 0.0.0.0          # inside the container only
      ENGRAM_MCP_PORT: 3801
      ENGRAM_AUTH_TOKEN: ${ENGRAM_AUTH_TOKEN:?set ENGRAM_AUTH_TOKEN in .env}

      # --- Embeddings (required) ------------------------------
      # Without an embedder Engram falls back to keyword-only search, which is
      # a much weaker system than the one described in the README. Treat these
      # as mandatory, not optional.
      #
      # OPENAI_BASE_URL must be the API ROOT, not the versioned path — Engram
      # appends /v1/embeddings itself. "https://host/v1" yields /v1/v1/... and
      # 404s. Most other tools want the /v1 form, so this one differs.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env — embeddings are required}
      ENGRAM_EMBEDDING_MODEL: ${ENGRAM_EMBEDDING_MODEL:-text-embedding-3-small}
      # Leave ENGRAM_EMBEDDING_DIMS unset unless your model is non-standard.
      # text-embedding-3-small is 1536, which is already the default — and
      # setting it explicitly makes Engram send a `dimensions` parameter that
      # some OpenAI-compatible gateways reject.
      #
      # The dimension is baked into the vault schema on first write. Changing
      # the model later is rejected at startup: see
      # docs/references/embedding-config-is-immutable.md
      ENGRAM_EMBEDDING_DIMS: ${ENGRAM_EMBEDDING_DIMS:-}

      # --- LLM ------------------------------------------------
      # There is deliberately no built-in default model — an unset model is a
      # startup error rather than a guess. Set it in .env.
      #
      # The OpenAI-compatible route is the only transport. It reaches every
      # model a LiteLLM-style gateway exposes — Gemini and Claude included — so
      # one base URL covers both embeddings and chat.
      ENGRAM_LLM_MODEL: ${ENGRAM_LLM_MODEL:?set ENGRAM_LLM_MODEL in .env — there is no default}
      ENGRAM_LLM_API_KEY: ${ENGRAM_LLM_API_KEY:?set ENGRAM_LLM_API_KEY in .env}
      # Root URL for the chat route. Leave unset for api.openai.com.
      ENGRAM_LLM_BASE_URL: ${ENGRAM_LLM_BASE_URL:-}

      # --- Access ---------------------------------------------
      ENGRAM_CORS_ORIGIN: ${ENGRAM_CORS_ORIGIN:-}

      # --- Storage --------------------------------------------
      ENGRAM_DB_PATH: /data/engram.db

    # Published on loopback only. Change deliberately, and keep the token.
    ports:
      - "127.0.0.1:${ENGRAM_HOST_PORT:-3801}:3801"

    volumes:
      - engram-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3801/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  engram-data:
